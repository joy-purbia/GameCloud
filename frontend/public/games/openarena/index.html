<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OpenArena — Cyber Sci-Fi FPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="glcanvas"></canvas>

    <!-- Crosshair -->
    <div id="crosshair">
      <div class="ch-center"></div>
      <div class="ch-line top"></div>
      <div class="ch-line bottom"></div>
      <div class="ch-line left"></div>
      <div class="ch-line right"></div>
    </div>

    <!-- FPS HUD -->
    <div id="hud">
      <div class="hud-top">
        <div class="stat-badge frags">
          <span class="label">FRAGS / KILLS</span>
          <span class="value" id="frag-count">0</span>
        </div>
        <div class="stat-badge time">
          <span class="label">MATCH TIME</span>
          <span class="value" id="match-time">00:00</span>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="stat-bar-container">
          <div class="stat-title">
            <span>ARMOR / HEALTH</span>
            <span id="health-val">100 HP</span>
          </div>
          <div class="health-bar-bg">
            <div id="health-bar-fill"></div>
          </div>
        </div>

        <div class="ammo-badge">
          <span class="label">PLASMA CHARGE</span>
          <span class="ammo-num"><span id="ammo-val">30</span> <small>/ 30</small></span>
        </div>
      </div>
    </div>

    <!-- Start / Result Overlay -->
    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <div class="tag-title">⚔️ ARENA COMBAT</div>
        <h1>OPENARENA</h1>
        <p class="subtitle">FAST-PACED CYBER FPS SHOOTER</p>
        <div class="controls-hint">
          <div class="key-row"><span class="key">WASD</span> <span>MOVE / STRAFE</span></div>
          <div class="key-row"><span class="key">MOUSE</span> <span>AIM / LOOK (CLICK TO LOCK)</span></div>
          <div class="key-row"><span class="key">LEFT CLICK</span> <span>FIRE PLASMA BLASTER</span></div>
          <div class="key-row"><span class="key">SPACE</span> <span>JUMP / USE JUMP PADS</span></div>
          <div class="key-row"><span class="key">R</span> <span>RELOAD ENERGY CORE</span></div>
        </div>
        <button id="btn-start" class="btn-play">ENTER COMBAT</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
