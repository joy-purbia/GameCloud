<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Futuristic Cloud Gaming Icon -->
  <path d="M 28 65 C 20 65 14 58 14 50 C 14 43 19 37 26 36 C 29 24 40 16 53 16 C 66 16 77 25 80 37 C 86 38 91 43 91 50 C 91 58 84 65 76 65 Z" 
        stroke="url(#cloudGrad)" stroke-width="4.5" fill="#0d111c" filter="url(#neonGlow)"/>
  <!-- Gamepad d-pad & buttons -->
  <path d="M 40 45 L 40 55 M 35 50 L 45 50" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="47" r="2.5" fill="#ec4899"/>
  <circle cx="66" cy="53" r="2.5" fill="#8b5cf6"/>
</svg>
