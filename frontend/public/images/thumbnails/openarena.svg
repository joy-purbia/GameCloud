<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="oa-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180404"/>
      <stop offset="50%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>

    <linearGradient id="plasma-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="red-flare" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="380" fill="url(#oa-bg)"/>

  <!-- Arena Metallic Grate Grid Floor -->
  <polygon points="40,380 600,380 440,240 200,240" fill="#13080c" stroke="#331018" stroke-width="2"/>
  <line x1="200" y1="240" x2="40" y2="380" stroke="#ef4444" stroke-width="3" filter="url(#red-flare)"/>
  <line x1="440" y1="240" x2="600" y2="380" stroke="#ef4444" stroke-width="3" filter="url(#red-flare)"/>

  <!-- Arena Jump Pad in Center (Glowing Cyan) -->
  <ellipse cx="320" cy="270" rx="60" ry="16" fill="#0891b2" stroke="#38bdf8" stroke-width="3" filter="url(#laser-glow)"/>
  <line x1="320" y1="260" x2="320" y2="180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" filter="url(#laser-glow)"/>

  <!-- Exploding AI Combat Drone Target -->
  <g transform="translate(320, 140)">
    <!-- Explosion Shockwave Rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6" filter="url(#red-flare)"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" filter="url(#red-flare)"/>

    <!-- Drone Body Core -->
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#ef4444" stroke-width="3"/>
    <!-- Glowing Eye Optic -->
    <circle cx="0" cy="0" r="10" fill="#facc15" filter="url(#red-flare)"/>

    <!-- Drone Outer Rings -->
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="none" stroke="#ef4444" stroke-width="3"/>

    <!-- Explosion Spark Particles -->
    <polygon points="0,-35 4,-20 18,-24 8,-12 25,-5" fill="#facc15"/>
    <polygon points="0,35 -4,20 -18,24 -8,12 -25,5" fill="#f97316"/>
    <polygon points="35,0 20,-4 24,-18 12,-8 5,-25" fill="#ef4444"/>
    <polygon points="-35,0 -20,4 -24,18 -12,8 -5,25" fill="#facc15"/>
  </g>

  <!-- Incoming Twin Laser Blaster Bolts -->
  <line x1="160" y1="360" x2="305" y2="155" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#laser-glow)"/>
  <line x1="200" y1="375" x2="315" y2="150" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#laser-glow)"/>

  <!-- First-Person Plasma Blaster Viewmodel (Bottom Left) -->
  <g transform="translate(140, 360)">
    <!-- Gun Body -->
    <polygon points="-40,40 50,40 85,-20 15,-20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Glowing Plasma Energy Core Tube -->
    <rect x="25" y="-14" width="45" height="12" rx="4" fill="url(#plasma-grad)" filter="url(#laser-glow)"/>
    <!-- Gun Barrel Muzzle -->
    <rect x="75" y="-22" width="20" height="24" rx="3" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <!-- Muzzle Flash Sparks -->
    <circle cx="105" cy="-10" r="14" fill="#38bdf8" opacity="0.8" filter="url(#laser-glow)"/>
  </g>

  <!-- Holographic Targeting Crosshair Overlay -->
  <g transform="translate(320, 140)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="14 10" filter="url(#laser-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <line x1="-42" y1="0" x2="-25" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="25" y1="0" x2="42" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-42" x2="0" y2="-25" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="25" x2="0" y2="42" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Title Badge Top Left -->
  <rect x="20" y="20" width="230" height="48" rx="8" fill="#080c18" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.5">OPENARENA CYBER FPS</text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#f87171" letter-spacing="1.5">FAST-PACED 3D ARENA COMBAT</text>

  <!-- Tag Pill Top Right -->
  <rect x="520" y="20" width="100" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#34d399" letter-spacing="1">PLAYABLE</text>
</svg>
