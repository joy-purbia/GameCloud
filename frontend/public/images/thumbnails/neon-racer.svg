<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070214"/>
      <stop offset="50%" stop-color="#1f0738"/>
      <stop offset="100%" stop-color="#090a16"/>
    </linearGradient>

    <!-- Synthwave Sun Gradient -->
    <linearGradient id="nr-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffd000"/>
    </linearGradient>

    <!-- Car Gradient -->
    <linearGradient id="nr-car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Highway Glow -->
    <linearGradient id="nr-road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="640" height="380" fill="url(#nr-bg)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="60" cy="40" r="1.5"/>
    <circle cx="120" cy="70" r="1"/>
    <circle cx="210" cy="30" r="1.5"/>
    <circle cx="480" cy="50" r="1"/>
    <circle cx="560" cy="80" r="1.5"/>
    <circle cx="590" cy="35" r="1.2"/>
    <circle cx="150" cy="110" r="1"/>
    <circle cx="510" cy="120" r="1.5"/>
  </g>

  <!-- Synthwave Sun -->
  <circle cx="320" cy="170" r="80" fill="url(#nr-sun)" filter="url(#glow-magenta)"/>
  
  <!-- Sun Horizontal Cuts -->
  <rect x="235" y="150" width="170" height="4" fill="#150528"/>
  <rect x="240" y="162" width="160" height="6" fill="#150528"/>
  <rect x="248" y="176" width="144" height="8" fill="#150528"/>
  <rect x="260" y="192" width="120" height="10" fill="#150528"/>
  <rect x="275" y="210" width="90" height="12" fill="#150528"/>

  <!-- Distant Mountains -->
  <polygon points="40,220 130,165 210,220" fill="#200b3b" opacity="0.8"/>
  <polygon points="170,220 250,150 340,220" fill="#16082b" opacity="0.9"/>
  <polygon points="300,220 390,145 490,220" fill="#200b3b" opacity="0.8"/>
  <polygon points="440,220 530,160 620,220" fill="#16082b" opacity="0.9"/>

  <!-- Perspective Highway -->
  <polygon points="290,220 350,220 590,380 50,380" fill="url(#nr-road)"/>

  <!-- Glowing Cyan Edge Rails -->
  <line x1="290" y1="220" x2="50" y2="380" stroke="#06b6d4" stroke-width="4" filter="url(#glow-cyan)"/>
  <line x1="350" y1="220" x2="590" y2="380" stroke="#06b6d4" stroke-width="4" filter="url(#glow-cyan)"/>

  <!-- Grid Perspective Lines on Highway -->
  <line x1="310" y1="220" x2="230" y2="380" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="330" y1="220" x2="410" y2="380" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- Horizontal Highway Grid Lines -->
  <line x1="270" y1="235" x2="370" y2="235" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  <line x1="240" y1="255" x2="400" y2="255" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <line x1="195" y1="285" x2="445" y2="285" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  <line x1="135" y1="325" x2="505" y2="325" stroke="#ec4899" stroke-width="2" opacity="0.7"/>

  <!-- Center Dash Line -->
  <line x1="320" y1="220" x2="320" y2="380" stroke="#f43f5e" stroke-width="5" stroke-dasharray="14 18" filter="url(#glow-magenta)"/>

  <!-- Cyber Sports Car (View from rear) -->
  <g transform="translate(320, 310)">
    <!-- Car shadow -->
    <ellipse cx="0" cy="42" rx="65" ry="10" fill="#000000" opacity="0.8"/>
    
    <!-- Neon Underglow -->
    <ellipse cx="0" cy="40" rx="55" ry="8" fill="#06b6d4" opacity="0.6" filter="url(#glow-cyan)"/>

    <!-- Car Body -->
    <polygon points="-48,35 48,35 40,15 32,5 -32,5 -40,15" fill="url(#nr-car)"/>

    <!-- Rear Cabin Window -->
    <polygon points="-24,6 24,6 20,-8 -20,-8" fill="#090d16" stroke="#06b6d4" stroke-width="1.5"/>

    <!-- Spoiler -->
    <rect x="-42" y="-12" width="84" height="4" rx="2" fill="#06b6d4" filter="url(#glow-cyan)"/>
    <rect x="-30" y="-8" width="5" height="12" fill="#1e293b"/>
    <rect x="25" y="-8" width="5" height="12" fill="#1e293b"/>

    <!-- Rear Lights Strip -->
    <rect x="-40" y="20" width="80" height="5" rx="2" fill="#f43f5e" filter="url(#glow-magenta)"/>

    <!-- Dual Exhaust Pipes -->
    <circle cx="-16" cy="33" r="4" fill="#06b6d4" filter="url(#glow-cyan)"/>
    <circle cx="16" cy="33" r="4" fill="#06b6d4" filter="url(#glow-cyan)"/>

    <!-- Speed Trails Behind Car -->
    <line x1="-38" y1="38" x2="-45" y2="65" stroke="#f43f5e" stroke-width="3" opacity="0.7"/>
    <line x1="38" y1="38" x2="45" y2="65" stroke="#f43f5e" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
