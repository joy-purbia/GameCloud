<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="stk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#16203d"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>

    <!-- Kart Red/Orange Gradient -->
    <linearGradient id="kart-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="gold-shine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="380" fill="url(#stk-bg)"/>

  <!-- Circuit Curving Road -->
  <path d="M-50,380 C150,350 250,220 320,160 C380,110 500,100 690,140" fill="none" stroke="#1e293b" stroke-width="110"/>
  
  <!-- Red & White Alternating Curbs -->
  <path d="M-50,320 C150,290 250,170 320,120 C380,70 500,60 690,100" fill="none" stroke="#ef4444" stroke-width="8" stroke-dasharray="24 24"/>
  <path d="M-50,320 C150,290 250,170 320,120 C380,70 500,60 690,100" fill="none" stroke="#ffffff" stroke-width="8" stroke-dashoffset="24" stroke-dasharray="24 24"/>

  <!-- Checkered Flag Banner Across Track -->
  <g transform="translate(360, 40) rotate(15)">
    <!-- Flag Pole -->
    <rect x="0" y="0" width="6" height="120" fill="#cbd5e1" rx="2"/>
    <!-- Checkered Cloth -->
    <g transform="translate(6, 5)">
      <rect x="0" y="0" width="80" height="50" fill="#ffffff" rx="4"/>
      <!-- Black squares -->
      <rect x="0" y="0" width="20" height="12.5" fill="#0f172a"/>
      <rect x="40" y="0" width="20" height="12.5" fill="#0f172a"/>
      <rect x="20" y="12.5" width="20" height="12.5" fill="#0f172a"/>
      <rect x="60" y="12.5" width="20" height="12.5" fill="#0f172a"/>
      <rect x="0" y="25" width="20" height="12.5" fill="#0f172a"/>
      <rect x="40" y="25" width="20" height="12.5" fill="#0f172a"/>
      <rect x="20" y="37.5" width="20" height="12.5" fill="#0f172a"/>
      <rect x="60" y="37.5" width="20" height="12.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- Mystery Item Box Floating -->
  <g transform="translate(480, 210)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#facc15" stroke="#f59e0b" stroke-width="3" filter="url(#gold-shine)"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="#713f12">?</text>
  </g>

  <!-- Tux in Racing Kart (Center Hero) -->
  <g transform="translate(240, 260)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="75" ry="14" fill="#000000" opacity="0.6"/>

    <!-- Left & Right Wheels -->
    <rect x="-65" y="15" width="20" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="45" y="15" width="20" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Kart Chassis -->
    <path d="M-50,30 L50,30 L40,-5 L-40,-5 Z" fill="url(#kart-grad)" stroke="#b45309" stroke-width="2"/>
    
    <!-- Spoiler -->
    <rect x="-45" y="-25" width="90" height="8" rx="3" fill="#1e293b"/>
    <rect x="-30" y="-17" width="6" height="12" fill="#475569"/>
    <rect x="24" y="-17" width="6" height="12" fill="#475569"/>

    <!-- Tux Mascot Character -->
    <!-- Penguin Body -->
    <ellipse cx="0" cy="-2" rx="26" ry="30" fill="#0f172a"/>
    <!-- Penguin White Belly -->
    <ellipse cx="0" cy="5" rx="16" ry="18" fill="#f8fafc"/>
    <!-- Penguin Eyes -->
    <circle cx="-8" cy="-14" r="5" fill="#f8fafc"/>
    <circle cx="-8" cy="-14" r="2.5" fill="#000"/>
    <circle cx="8" cy="-14" r="5" fill="#f8fafc"/>
    <circle cx="8" cy="-14" r="2.5" fill="#000"/>
    <!-- Beak -->
    <polygon points="-7,-7 7,-7 0,2" fill="#f97316"/>
    <!-- Racing Helmet (Cyan Visor) -->
    <path d="M-22,-14 C-22,-36 22,-36 22,-14 Z" fill="#0284c7"/>
    <rect x="-16" y="-18" width="32" height="6" rx="2" fill="#38bdf8"/>

    <!-- Steering Wheel -->
    <ellipse cx="0" cy="12" rx="18" ry="6" fill="none" stroke="#334155" stroke-width="4"/>

    <!-- Nitro Spark Flames -->
    <polygon points="-25,32 -35,58 -20,42" fill="#38bdf8"/>
    <polygon points="25,32 35,58 20,42" fill="#38bdf8"/>
  </g>
</svg>
