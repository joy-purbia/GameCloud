<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hx-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0314"/>
      <stop offset="50%" stop-color="#1f0933"/>
      <stop offset="100%" stop-color="#07020d"/>
    </linearGradient>

    <linearGradient id="ship-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>

    <filter id="pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boost-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="380" fill="url(#hx-bg)"/>

  <!-- Cyber Tunnel Rings (Perspective circles) -->
  <ellipse cx="320" cy="180" rx="280" ry="140" fill="none" stroke="#3b0764" stroke-width="2" opacity="0.4"/>
  <ellipse cx="320" cy="180" rx="200" ry="100" fill="none" stroke="#581c87" stroke-width="2" opacity="0.5"/>
  <ellipse cx="320" cy="180" rx="130" ry="65" fill="none" stroke="#7e22ce" stroke-width="2" opacity="0.6"/>
  <ellipse cx="320" cy="180" rx="70" ry="35" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8"/>

  <!-- Speed Track Ribbons (Banked Curve) -->
  <path d="M-20,380 C180,320 280,240 320,180" fill="none" stroke="#ec4899" stroke-width="6" filter="url(#pink-glow)"/>
  <path d="M660,380 C460,320 360,240 320,180" fill="none" stroke="#06b6d4" stroke-width="6" filter="url(#boost-glow)"/>

  <!-- Track Surface -->
  <polygon points="120,380 520,380 340,210 300,210" fill="#0d091e" stroke="#ec4899" stroke-width="1.5"/>

  <!-- Speed Boost Chevrons on Track -->
  <path d="M290,260 L320,245 L350,260" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#boost-glow)"/>
  <path d="M270,300 L320,278 L370,300" fill="none" stroke="#f59e0b" stroke-width="5" filter="url(#boost-glow)"/>
  <path d="M240,350 L320,320 L400,350" fill="none" stroke="#f59e0b" stroke-width="6" filter="url(#boost-glow)"/>

  <!-- Futuristic Anti-Gravity Hovercraft (Sleek aerodynamic ship) -->
  <g transform="translate(320, 210) rotate(-6)">
    <!-- Shield / Plasma Aura -->
    <ellipse cx="0" cy="5" rx="90" ry="35" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" filter="url(#boost-glow)"/>

    <!-- Thruster Twin Flames -->
    <polygon points="-35,30 -25,30 -30,65" fill="#06b6d4" filter="url(#boost-glow)"/>
    <polygon points="25,30 35,30 30,65" fill="#06b6d4" filter="url(#boost-glow)"/>
    <polygon points="-8,32 8,32 0,75" fill="#38bdf8" filter="url(#boost-glow)"/>

    <!-- Ship Central Fuselage -->
    <polygon points="0,-45 28,15 18,32 -18,32 -28,15" fill="url(#ship-body)"/>

    <!-- Cockpit Canopy Glass -->
    <polygon points="0,-25 10,-2 6,12 -6,12 -10,-2" fill="#38bdf8" opacity="0.9" filter="url(#boost-glow)"/>

    <!-- Swept Wings -->
    <polygon points="-28,15 -85,32 -30,35" fill="#ec4899" stroke="#f43f5e" stroke-width="1.5"/>
    <polygon points="28,15 85,32 30,35" fill="#ec4899" stroke="#f43f5e" stroke-width="1.5"/>

    <!-- Wing Tip Neon Lights -->
    <circle cx="-85" cy="32" r="3" fill="#38bdf8" filter="url(#boost-glow)"/>
    <circle cx="85" cy="32" r="3" fill="#38bdf8" filter="url(#boost-glow)"/>
  </g>

  <!-- Title Badge Top Left -->
  <rect x="20" y="20" width="220" height="48" rx="8" fill="#080c18" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.5"/>
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">HEXGL HYPERSPEED</text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#ec4899" letter-spacing="1.5">ANTI-GRAVITY CIRCUIT RACING</text>

  <!-- Tag Pill Top Right -->
  <rect x="520" y="20" width="100" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#34d399" letter-spacing="1">PLAYABLE</text>
</svg>
