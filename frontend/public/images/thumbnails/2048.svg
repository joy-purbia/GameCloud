<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="puz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <!-- 2048 Gold Gradient -->
    <linearGradient id="t-2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- 1024 Cyan Gradient -->
    <linearGradient id="t-1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- 512 Purple Gradient -->
    <linearGradient id="t-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- 256 Pink Gradient -->
    <linearGradient id="t-256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="url(#puz-bg)"/>

  <!-- Cyber Grid Circuit Background -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.12">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="560" y1="0" x2="560" y2="380"/>
  </g>

  <!-- Central 4x4 Grid Board -->
  <g transform="translate(195, 60)" filter="url(#board-shadow)">
    <!-- Board Base -->
    <rect width="250" height="250" rx="16" fill="#0c1222" stroke="#1e293b" stroke-width="3"/>

    <!-- Row 1 -->
    <rect x="12" y="12" width="50" height="50" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="37" y="44" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="18" font-weight="800" fill="#64748b">2</text>

    <rect x="70" y="12" width="50" height="50" rx="8" fill="#334155" opacity="0.8"/>
    <text x="95" y="44" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="18" font-weight="800" fill="#94a3b8">4</text>

    <rect x="128" y="12" width="50" height="50" rx="8" fill="#0f766e"/>
    <text x="153" y="44" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="18" font-weight="800" fill="#5eead4">8</text>

    <rect x="186" y="12" width="50" height="50" rx="8" fill="#0369a1"/>
    <text x="211" y="44" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="16" font-weight="800" fill="#7dd3fc">16</text>

    <!-- Row 2 -->
    <rect x="12" y="70" width="50" height="50" rx="8" fill="#1e293b" opacity="0.4"/>
    
    <rect x="70" y="70" width="50" height="50" rx="8" fill="#4338ca"/>
    <text x="95" y="102" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="16" font-weight="800" fill="#a5b4fc">32</text>

    <rect x="128" y="70" width="50" height="50" rx="8" fill="#6d28d9"/>
    <text x="153" y="102" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="16" font-weight="800" fill="#c4b5fd">64</text>

    <rect x="186" y="70" width="50" height="50" rx="8" fill="#be185d"/>
    <text x="211" y="102" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="800" fill="#fbcfe8">128</text>

    <!-- Row 3 -->
    <rect x="12" y="128" width="50" height="50" rx="8" fill="#1e293b" opacity="0.4"/>

    <rect x="70" y="128" width="50" height="50" rx="8" fill="url(#t-256)"/>
    <text x="95" y="160" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="800" fill="#ffffff">256</text>

    <rect x="128" y="128" width="50" height="50" rx="8" fill="url(#t-512)"/>
    <text x="153" y="160" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="800" fill="#ffffff">512</text>

    <rect x="186" y="128" width="50" height="50" rx="8" fill="url(#t-1024)"/>
    <text x="211" y="160" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="13" font-weight="800" fill="#ffffff">1024</text>

    <!-- Row 4 - Glowing 2048 Hero Tile -->
    <rect x="12" y="186" width="50" height="50" rx="8" fill="#1e293b" opacity="0.4"/>
    <rect x="70" y="186" width="50" height="50" rx="8" fill="#1e293b" opacity="0.4"/>
    <rect x="128" y="186" width="50" height="50" rx="8" fill="#1e293b" opacity="0.4"/>

    <rect x="186" y="186" width="50" height="50" rx="8" fill="url(#t-2048)" filter="url(#gold-glow)"/>
    <text x="211" y="218" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#000000">2048</text>
  </g>
</svg>
